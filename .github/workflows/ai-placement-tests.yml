name: IR AI placement tests
on:
  push:
    branches:
      - feature/ir-project-ai-next
    paths:
      - 'src/ai-placement-pipeline.js'
      - 'src/ai-scheme-preview.js'
      - 'src/ai-pdf-mark-matcher.js'
      - 'src/ai-pdf-axis-projection.js'
      - 'src/ai-pdf-spatial-associations.js'
      - 'src/ai-pdf-dimension-chains.js'
      - 'tests/ai-pdf-dimension-chains.test.js'
      - 'tests/ai-pdf-spatial-associations.test.js'
      - 'tests/ai-pdf-axis-projection.test.js'
      - 'tests/ai-pdf-mark-matcher.test.js'
      - 'src/ai-pdf-candidates.js'
      - 'src/ai-pdf-title-block.js'
      - 'tests/ai-pdf-title-block.test.js'
      - 'tests/ai-pdf-candidates-title-block.test.js'
      - 'tests/ai-placement-pipeline.test.js'
      - 'tests/ai-scheme-preview.test.js'
      - '.github/workflows/ai-placement-tests.yml'
  workflow_dispatch:
jobs:
  placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PDF mark matching
        run: node tests/ai-pdf-mark-matcher.test.js
      - name: Validate PDF title-block evidence
        run: node tests/ai-pdf-candidates-title-block.test.js
      - name: Validate automatic PDF title-block detection
        run: node tests/ai-pdf-title-block.test.js
      - name: Validate PDF axis grid and calibration
        run: node tests/ai-pdf-axis-projection.test.js
      - name: Validate PDF dimension chains
        run: node tests/ai-pdf-dimension-chains.test.js
      - name: Validate PDF spatial associations
        run: node tests/ai-pdf-spatial-associations.test.js
      - name: Validate placement pipeline
        run: node tests/ai-placement-pipeline.test.js
      - name: Validate Three.js preview adapter
        run: node tests/ai-scheme-preview.test.js
