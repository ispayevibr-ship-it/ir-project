name: Build PyMuPDF Windows helper
on:
  workflow_dispatch:
jobs:
  build-helper:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF and PyInstaller
        run: python -m pip install --upgrade pymupdf pyinstaller
      - name: Build helper
        run: python -m PyInstaller --onefile --name ir-pymupdf-extract --distpath build/pymupdf src/ai-pymupdf-extract.py
      - name: Upload helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: ir-pymupdf-windows
          path: build/pymupdf/ir-pymupdf-extract.exe
