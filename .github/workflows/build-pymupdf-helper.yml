name: Build PyMuPDF Windows helper
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ir-project-ai-next
    paths:
      - 'src/ai-pymupdf-*.py'
      - 'src/ai-pymupdf-*.js'
      - 'src/ai-pdf-index.js'
      - 'tests/pymupdf-elevation-smoke.js'
      - 'package.json'
      - '.github/workflows/build-pymupdf-helper.yml'
jobs:
  build-helper:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PyMuPDF and PyInstaller
        run: python -m pip install pymupdf pyinstaller
      - name: Build helper
        run: python -m PyInstaller --onefile --name ir-pymupdf-extract --distpath build/pymupdf src/ai-pymupdf-extract.py
      - name: Smoke test extracted text and page geometry
        shell: pwsh
        run: |
          python -c "import fitz; d=fitz.open(); p=d.new_page(); p.insert_text((70,70), 'K62 +9.705'); d.save('test-pymupdf.pdf')"
          & ./build/pymupdf/ir-pymupdf-extract.exe test-pymupdf.pdf | Out-File -FilePath result.json -Encoding utf8
          python -c "import json; d=json.load(open('result.json',encoding='utf-8-sig')); assert d['parser']=='pymupdf'; assert len(d['pages'])==1; assert any('K62' in f['text'] for f in d['pages'][0]['fragments'])"
      - name: Test Electron-side PyMuPDF runner
        shell: pwsh
        run: |
          $env:IR_PYMUPDF_PYTHON = "python"
          node -e "const fs=require('node:fs');const {extractWithPyMuPDF}=require('./src/ai-pymupdf-runner');extractWithPyMuPDF(fs.readFileSync('test-pymupdf.pdf')).then(r=>{if(r.pages.length!==1||!r.pages[0].fragments.some(f=>f.text.includes('K62')))process.exitCode=1}).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Verify helper is present in package resources
        shell: pwsh
        run: |
          if (!(Test-Path 'build/pymupdf/ir-pymupdf-extract.exe')) { throw 'PyMuPDF executable missing' }
      - name: Test extracted elevation through IR Project inspection
        run: node tests/pymupdf-elevation-smoke.js test-pymupdf.pdf
      - name: Upload helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: ir-pymupdf-windows
          path: build/pymupdf/ir-pymupdf-extract.exe
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows beta with PyMuPDF
        run: npm run build
      - name: Verify bundled helper in packaged application
        shell: pwsh
        run: |
          $appDir = Get-ChildItem -Path dist -Directory -Filter 'win-unpacked' | Select-Object -First 1
          if (!$appDir) { throw 'Windows unpacked app not found' }
          $helper = Join-Path $appDir.FullName 'resources/pymupdf/ir-pymupdf-extract.exe'
          if (!(Test-Path $helper)) { throw "Bundled PyMuPDF missing: $helper" }
          & $helper test-pymupdf.pdf | Out-File -FilePath packaged-result.json -Encoding utf8
          python -c "import json; d=json.load(open('packaged-result.json',encoding='utf-8-sig')); assert len(d['pages'])==1; assert any('K62' in f['text'] for f in d['pages'][0]['fragments'])"
      - name: Upload Windows beta
        uses: actions/upload-artifact@v4
        with:
          name: ir-project-pymupdf-beta
          path: dist/*.exe
