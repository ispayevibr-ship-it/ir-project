name: K62 recognition regression
on:
  push:
    branches: [feature/ir-project-ai-next]
  workflow_dispatch:
jobs:
  k62:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: K62 recognition tests
        run: node --test src/ai-mounting-k62.test.js
