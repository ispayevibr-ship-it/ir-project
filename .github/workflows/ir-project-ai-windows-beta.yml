name: IR Project AI Windows Beta
on:
  push:
    branches:
      - feature/ir-project-ai-next
    # Renderer JS and explicitly hot-loaded modules must not rebuild the installer.
    # Native/bootstrap changes continue through the Windows Beta workflow.
    paths-ignore:
      - "hot/**"
      - "src/ai-recognition-page.js"
      - "src/ai-scheme-lite-page.js"
      - "src/ai-pdf-geometry.js"
      - "src/ai-pdf-vector-worker.js"
      - "src/ai-pdf-vector-paths.js"
      - "src/ai-document-store.js"
      - "src/ai-structured-review.js"
      - "src/ai-*.css"
      - "scripts/test-ai-*.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-beta:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate local algorithmic KM/KMD drawing processing
        shell: bash
        run: |
          set -euo pipefail
          node --check src/ir-runtime.js
          node --check src/ai-recognition-page.js
          node --check src/ai-scheme-lite-page.js
          node --check src/ai-image-optimizer.js
          node scripts/test-ai-scheme-lite.js
          node scripts/test-ai-scheme-lite-ui.js
          node scripts/test-ai-beta-hot.js
          node scripts/test-updater-rollback.js
          node scripts/test-ai-pdf-drawings-ui.js
          node scripts/test-ai-navigation.js
          node scripts/test-scheme-reset.js
          node scripts/test-ai-mounting-batch.js
          node scripts/test-ai-mounting-placement.js
          node scripts/test-ai-mounting-drafts.js
          node scripts/test-ai-mounting-drafts-ui.js
          node --check src/ai-pdf-vector-worker.js
          node --check src/ai-pdf-geometry.js
          node scripts/test-ai-pdf-vector-paths.js
          node scripts/test-ai-pdf-hot-worker.js
          node scripts/test-ai-pdf-geometry.js
          node scripts/test-ai-pdf-geometry-ui.js
          node scripts/test-ai-grid-axes.js
          node scripts/test-ai-grid-axes-ui.js
          node scripts/test-ai-pdf-vector-real.js
          node scripts/test-ai-source-evidence.js
          node scripts/test-ai-mounting-ui-flow.js
          node scripts/test-scheme-bundle-updated.js
          node scripts/test-ai-storage.js
          node scripts/test-ai-document-archive.js
          node scripts/test-ai-document-hot-loader.js
      - name: Build NSIS installer without publishing
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload beta installer
        uses: actions/upload-artifact@v4
        with:
          name: IR-Project-AI-Windows-Beta
          path: dist/IR-Project-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
