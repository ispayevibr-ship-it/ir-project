name: IR Project AI Windows Beta
on:
  push:
    branches:
      - feature/ir-project-ai-next
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-beta:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build NSIS installer without publishing
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload beta installer
        uses: actions/upload-artifact@v4
        with:
          name: IR-Project-AI-Windows-Beta
          path: dist/IR-Project-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
