name: Verify IR Project hot update

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'hot/latest.json'
      - 'scripts/build-runtime.js'
      - 'scripts/test-*.js'
      - '.github/workflows/verify-hot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF parser dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check src/database.js
          node --check src/updater.js
          node --check src/app.js
          node --check src/scheme-page.js
          node --check src/scheme-building-view.js
          node --check src/ir-runtime.js
          node --check src/ai-recognition-page.js
          node --check src/ai-document-store.js
          node --check src/ai-local-engine.js
          node --check src/ai-analysis.js
          node --check src/ai-pdf-worker.js
          node --check src/ai-pdf-index.js
          node --check src/ai-pdf-render-worker.js
          node --check src/ai-pdf-renderer.js
          node --check src/ai-model-manager.js
          node --check src/ai-model-catalog.js
          node --check src/ai-model-download.js
          node --check src/ai-model-settings.js
          node --check src/ai-runtime-diagnostics.js
      - name: Test IR Project AI local document storage
        run: node scripts/test-ai-storage.js
      - name: Test IR Project AI navigation and bridge
        run: node scripts/test-ai-navigation.js
      - name: Test real local vision engine wiring and provenance
        run: node scripts/test-ai-engine.js
      - name: Test real PDF text extraction and isolated sheet indexing
        run: node scripts/test-ai-pdf.js
      - name: Test real PDF sheet PNG rendering and local AI source linkage
        run: node scripts/test-ai-pdf-render.js
      - name: Test signed offline model packs and atomic rollback
        run: node scripts/test-ai-model-manager.js
      - name: Test signed HTTPS model catalog and verified download
        run: node scripts/test-ai-model-catalog.js
      - name: Test installed Qwen3-VL 4B runtime integration
        run: node scripts/test-ai-model-runtime.js
      - name: Test real local GPU probe and model-inference diagnostics
        run: node scripts/test-ai-runtime-diagnostics.js
      - name: Test real offline model publisher and signed catalog
        run: |
          node --check scripts/ai-pack-publisher.js
          node --check scripts/build-qwen4-pack.js
          node --check scripts/sign-ai-catalog.js
          node scripts/test-ai-pack-publisher.js
      - name: Test structural member copying
        run: node scripts/test-scheme-copy.js
      - name: Test cached scheme records and in-place refresh
        run: node scripts/test-scheme-performance.js
      - name: Test Plan and 3D feature parity
        run: node scripts/test-scheme-parity.js
      - name: Test isolated Three.js 3D viewer
        run: node scripts/test-scheme-three-view.js
      - name: Test cut widths in the 3D panel
        run: node scripts/test-scheme-cut-width.js
      - name: Test 3D dimensions and Plan background
        run: node scripts/test-scheme-drawing-annotations.js
      - name: Test visible 3D controls and Plan SVG fill
        run: node scripts/test-scheme-visible-controls.js
      - name: Test color legend visibility in narrow 3D sidebar
        run: node scripts/test-scheme-color-legend.js
      - name: Test runtime revision check for old Electron tabs
        run: node scripts/test-scheme-runtime-version.js
      - name: Test indexed scheme loading with large member lists
        run: node scripts/test-scheme-load-indexes.js
      - name: Test scheme loading overlay until first 3D frame
        run: node scripts/test-scheme-load-overlay.js
      - name: Test About dialog and installed version
        run: node scripts/test-program-about.js
      - name: Test redesigned settings menu in standalone and tabbed windows
        run: node scripts/test-settings-menu.js
      - name: Test contextual Russian names
        run: node scripts/test-work-nomenclature.js
      - name: Test real-data supply and montage chart
        run: node scripts/test-supply-chart.js
      - name: Test full object HTML export
        run: node scripts/test-object-export-html.js
      - name: Test customer and contractor logos in object editor
        run: node scripts/test-object-party-logos.js
      - name: Test database export from settings
        run: node scripts/test-database-export-settings.js
      - name: Test styled success and error notices
        run: node scripts/test-notice-variants.js
      - name: Test database safety on incompatible schemas
        run: node scripts/test-database-safety.js
      - name: Test atomic hot-update rollback
        run: node scripts/test-updater-rollback.js
      - name: Check generated JavaScript and CSS bundles
        run: node scripts/build-runtime.js --check
      - name: Check hot-update manifest sizes
        run: |
          node -e 'const fs=require("fs"),m=require("./hot/latest.json");for(const f of m.files){const actual=fs.statSync(f.source).size;if(actual!==f.size)throw Error(f.source+": manifest size "+f.size+" != "+actual)}'
