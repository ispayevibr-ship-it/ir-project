name: Build IR Project Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.js'
      - 'preload.js'
      - 'src/ai-document-store.js'
      - 'package.json'
      - '.github/workflows/build-installer.yml'
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify local document store
        run: node scripts/test-ai-storage.js
      - name: Build unsigned NSIS installer
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: IR-Project-Setup-1.7.207
          path: dist/IR-Project-Setup-1.7.207.exe
          if-no-files-found: error
