name: Release Windows

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ir-project-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Publish one release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release delete "$env:TAG" --cleanup-tag --yes 2>$null
          gh release create "$env:TAG" `
            "dist/IR Project Setup $env:VERSION.exe" `
            "dist/IR Project Setup $env:VERSION.exe.blockmap" `
            "dist/latest.yml" `
            --title "$env:VERSION" `
            --target "${{ github.sha }}" `
            --latest
