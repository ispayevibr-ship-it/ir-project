name: Release Windows

on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Testing installer only: never publish release or hot update"
        type: boolean
        required: true
        default: true
  push:
    branches:
      - main
    paths:
      - package.json
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: ir-project-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify Electron safety before packaging
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check src/ai-document-store.js
          node --check src/ai-analysis.js
          node --check src/ai-local-engine.js
          node --check src/ai-paddle-ocr.js
          node --check src/ai-acceptance-preflight.js
          node --check scripts/test-ai-acceptance-preflight.js
          node scripts/test-ai-acceptance-preflight.js
          node --check src/ai-complete-backup.js
          node --check src/ai-review.js
          node --check src/ai-workflow.js
          node --check src/ai-workflow-page.js
          node --check src/ai-recognition-page.js
          node --check src/ai-pdf-worker.js
          node --check src/ai-pdf-index.js
          node --check src/ai-pdf-render-worker.js
          node --check src/ai-pdf-renderer.js
          node --check src/ai-model-manager.js
          node --check src/ai-model-catalog.js
          node --check src/ai-model-download.js
          node --check src/ai-model-settings.js
          node --check src/ai-runtime-diagnostics.js
          node scripts/test-ai-runtime-diagnostics.js
          node scripts/test-ai-model-manager.js
          node scripts/test-ai-model-catalog.js
          node scripts/test-ai-model-runtime.js
          node --check scripts/ai-pack-publisher.js
          node --check scripts/ai-paddleocr-pack-publisher.js
          node --check scripts/build-qwen4-pack.js
          node --check scripts/build-paddleocr-pack.js
          node --check scripts/sign-ai-catalog.js
          node --check scripts/test-ai-pack-publisher.js
          node --check scripts/test-ai-paddleocr-pack-publisher.js
          node --check scripts/test-ai-multi-model-catalog.js
          node --check scripts/test-ai-paddle-ocr.js
          node --check scripts/test-ai-paddle-ocr-integration.js
          # Release-time acceptance: synthetic contracts run only when the
          # release workflow is executed, never on feature-branch commits.
          node scripts/test-ai-pack-publisher.js
          node scripts/test-ai-paddleocr-pack-publisher.js
          node scripts/test-ai-multi-model-catalog.js
          node scripts/test-ai-paddle-ocr.js
          node scripts/test-ai-paddle-ocr-integration.js
          node scripts/test-ai-complete-backup.js
          node scripts/test-ai-pdf.js
          node scripts/test-ai-pdf-render.js
          node scripts/test-ai-engine.js
          node scripts/test-ai-storage.js
          node --check src/database.js
          node --check src/updater.js
          node scripts/test-database-safety.js
          node scripts/test-updater-rollback.js
          node scripts/test-database-export-settings.js
          # Windows checkout can normalize line endings differently from the
          # committed Linux-verified bundle. Rebuild from the current sources.
          node scripts/build-runtime.js
          node scripts/build-runtime.js --check

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check release
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.preview_only != true)
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

      - name: Build installer
        if: (github.event_name == 'workflow_dispatch' && inputs.preview_only == true) || (github.ref == 'refs/heads/main' && steps.release_check.outputs.exists != 'true')
        run: npx electron-builder --win nsis --publish never

      - name: Upload installer artifact
        if: (github.event_name == 'workflow_dispatch' && inputs.preview_only == true) || (github.ref == 'refs/heads/main' && steps.release_check.outputs.exists != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: IR-Project-${{ steps.version.outputs.version }}-${{ github.run_number }}${{ inputs.preview_only && '-AI-PREVIEW' || '' }}
          path: |
            dist/IR-Project-Setup-${{ steps.version.outputs.version }}.exe
            dist/IR-Project-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.preview_only != true) && steps.release_check.outputs.exists != 'true'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$env:TAG" `
            "dist/IR-Project-Setup-$env:VERSION.exe" `
            "dist/IR-Project-Setup-$env:VERSION.exe.blockmap" `
            "dist/latest.yml" `
            --title "$env:VERSION" `
            --target "${{ github.sha }}" `
            --latest

      - name: Publish hot update manifest
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.preview_only != true) && steps.release_check.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $index = Get-Content "src/index.html" -Raw
          $files = New-Object System.Collections.Generic.List[object]
          $allowed = New-Object 'System.Collections.Generic.HashSet[string]' ([System.StringComparer]::OrdinalIgnoreCase)

          function Add-RuntimeFile([string]$path) {
            if (-not (Test-Path $path)) { throw "Runtime file not found: $path" }
            if ($allowed.Add($path)) {
              $files.Add([ordered]@{ source = $path; target = $path }) | Out-Null
            }
          }

          Add-RuntimeFile "src/index.html"
          [regex]::Matches($index, '(?:src|href)="\./([^"?]+)') | ForEach-Object {
            Add-RuntimeFile ("src/" + $_.Groups[1].Value)
          }

          $releaseRows = @(gh release list --limit 30 --json tagName,publishedAt | ConvertFrom-Json)
          $previousTag = ($releaseRows | Where-Object { $_.tagName -ne $env:TAG } | Select-Object -First 1).tagName
          if ($previousTag) {
            $base = gh release view "$previousTag" --json targetCommitish --jq '.targetCommitish'
            Write-Host "Checking hot-update safety from $previousTag ($base) to HEAD"
            $changed = @(git diff --name-only $base HEAD)
          } else {
            Write-Host "No previous release found; checking only current commit"
            $changed = @(git diff --name-only HEAD^ HEAD)
          }

          $unsafe = @()
          foreach ($path in $changed) {
            if ($path -eq "package.json") { continue }
            if (-not $allowed.Contains($path)) { $unsafe += $path }
          }

          if ($unsafe.Count -gt 0) {
            Write-Host "Hot update skipped because non-runtime files changed: $($unsafe -join ', ')"
            exit 0
          }

          $manifest = [ordered]@{
            version = $env:VERSION
            files = $files
          } | ConvertTo-Json -Depth 5 -Compress

          [System.IO.Directory]::CreateDirectory("hot") | Out-Null
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "hot/latest.json"),
            $manifest,
            (New-Object System.Text.UTF8Encoding($false))
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hot/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update hot manifest to $env:VERSION"
            git push origin HEAD:main
          }
