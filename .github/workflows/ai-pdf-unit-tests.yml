name: AI PDF unit tests
on:
  push:
    branches:
      - feature/ir-project-ai-next
    paths:
      - 'src/ai-pdf-*.js'
      - '.github/workflows/ai-pdf-unit-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test drawing recognition and scheme geometry
        run: |
          node scripts/test-ai-scheme-lite.js
          node scripts/test-ai-pdf-geometry-cache.js
          node scripts/test-ai-pdf-drawings-ui.js
      - name: Run deterministic PDF unit tests
        run: node --test src/ai-pdf-mark-matcher.test.js src/ai-pdf-axis-calibration.test.js src/ai-pdf-mark-projection.test.js src/ai-pdf-mark-projection-viewport.test.js src/ai-pdf-index-mark-summary.test.js src/ai-pdf-index-completeness.test.js
