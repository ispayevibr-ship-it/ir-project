name: AI PDF unit tests
on:
  push:
    branches:
      - feature/ir-project-ai-next
    paths:
      - 'src/ai-pdf-*.js'
      - 'src/ai-scheme-lite-page.js'
      - 'scripts/test-ai-*.js'
      - 'scripts/test-041-2025-archive.js'
      - 'scripts/test-041-2025-columns.js'
      - '.github/workflows/ai-pdf-unit-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for real PDF fixture
        if: ${{ env.IR_KMD_TEST_ARCHIVE != '' }}
        run: npm install --ignore-scripts --no-package-lock
      - name: Run real 041-2025 archive regression when fixture is mounted
        if: ${{ env.IR_KMD_TEST_ARCHIVE != '' }}
        run: |
          node scripts/test-041-2025-archive.js "$IR_KMD_TEST_ARCHIVE"
          node scripts/test-041-2025-columns.js
      - name: Validate real archive test harness syntax
        run: |
          node --check scripts/test-041-2025-archive.js
          node --check scripts/test-041-2025-columns.js
      - name: Test drawing recognition and scheme geometry
        run: |
          node scripts/test-ai-scheme-lite.js
          node scripts/test-ai-pdf-geometry-cache.js
          node scripts/test-ai-pdf-drawings-ui.js
      - name: Test offline OCR policy
        run: node --test src/ai-pdf-ocr-policy.test.js src/ai-pdf-ocr.test.js src/ai-pdf-scan-analysis.test.js src/ai-pdf-ocr-status.test.js src/ai-pdf-scan-queue.test.js src/ai-pdf-ocr-readiness.test.js src/ai-pdf-scan-service.test.js src/ai-pdf-register-audit.test.js src/ai-pdf-coordinate-candidates.test.js src/ai-pdf-segment-evidence.test.js
      - name: Run deterministic PDF unit tests
        run: node --test src/ai-pdf-mark-matcher.test.js src/ai-pdf-axis-calibration.test.js src/ai-pdf-mark-projection.test.js src/ai-pdf-mark-projection-viewport.test.js src/ai-pdf-index-mark-summary.test.js src/ai-pdf-index-completeness.test.js
