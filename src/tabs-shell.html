<header class="tabs-bar">
 <nav id="tabsList" class="tabs-list" aria-label="Открытые вкладки"><button id="tabsAdd" class="tabs-add" type="button" title="Новая вкладка (Ctrl+T)" aria-label="Создать вкладку">＋</button></nav>
 <div class="tabs-tools"><button type="button" id="tabsReload" title="Обновить текущую вкладку" aria-label="Обновить текущую вкладку"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg></button><button type="button" id="tabsDuplicate" title="Дублировать вкладку" aria-label="Дублировать вкладку"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button><button type="button" id="tabsDetach" title="Открыть в отдельном окне" aria-label="Открыть в отдельном окне"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-10 10"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></button><div id="tabsProfileSlot" class="tabs-profile-slot" aria-label="Профиль"></div></div>
</header>
<div id="tabsContent" class="tabs-content" aria-label="Содержимое вкладок"><div id="tabsLoading" class="tabs-loading" hidden aria-live="polite"><span class="tabs-loading-spinner" aria-hidden="true"></span><span id="tabsLoadingText">Открываем страницу…</span><div class="tabs-loading-help"><button id="tabsLoadingRetry" type="button" hidden>Повторить обновление</button><button id="tabsLoadingShow" type="button" hidden>Показать страницу</button></div></div></div>
<dialog id="tabsUpdateDialog" class="tabs-update-dialog" aria-labelledby="tabsUpdateTitle">
 <div class="tabs-update-header"><span class="tabs-update-icon" aria-hidden="true">↻</span><h2 id="tabsUpdateTitle">Проверка обновлений</h2><button id="tabsUpdateClose" type="button" class="tabs-update-close" aria-label="Закрыть окно">×</button></div>
 <p id="tabsUpdateText" class="tabs-update-message" aria-live="polite">Проверяем доступную версию IR Project…</p>
 <div id="tabsUpdateSize" class="tabs-update-size" hidden>Размер обновления: уточняется…</div>
 <div id="tabsUpdateProgress" class="tabs-update-progress" hidden><div class="tabs-update-progress-track"><div id="tabsUpdateProgressBar"></div></div><span id="tabsUpdateProgressLabel">0%</span></div>

 <div id="tabsUpdateActions" class="tabs-update-actions"></div>
</dialog>
